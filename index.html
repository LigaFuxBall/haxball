<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HaxBall 3D</title>
<style>
:root{--bg:#0e1621;--pan:rgba(10,16,26,.82);--fg:#fff;--ac:#ffd84d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0}[hidden]{display:none!important}
button{border:0;border-radius:6px;padding:7px 11px;background:#33415a;color:#fff;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.2)}input{padding:7px;border-radius:6px;border:0;font-size:14px}
.pan{background:var(--pan);border-radius:10px;padding:10px}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,20,.85);z-index:5}
#lobby .pan{width:min(340px,90vw);display:flex;flex-direction:column;gap:9px}#lobby h1{margin:0;text-align:center}
#err{color:#ff7a7a;min-height:1em;font-size:13px}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);font-size:24px;font-weight:700;white-space:nowrap;text-align:center}
#top small{display:block;font-size:13px;color:var(--ac)}
#code{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;font-size:13px;display:flex;gap:6px;align-items:center}
#mb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px}
#msg{position:fixed;top:36%;left:0;right:0;text-align:center;font-size:44px;font-weight:800;text-shadow:0 3px 12px #000;pointer-events:none}
#chat{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(420px,92vw);font-size:14px}
#log div{padding:2px 6px;background:rgba(0,0,0,.35);margin-top:1px;border-radius:4px;transition:opacity 1s;word-break:break-word}
#log div.old{opacity:0}#chat.f #log div.old{opacity:1}
#ci{width:100%;box-sizing:border-box;margin-top:4px;background:rgba(0,0,0,.5);color:#fff}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:4;background:rgba(0,0,0,.45)}
#menu.on{display:flex}#mp{width:min(760px,96vw);max-height:90vh;overflow:auto}
#cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.col{background:rgba(255,255,255,.06);border-radius:8px;padding:6px;min-height:80px}.col h3{margin:0 0 6px;font-size:14px;text-align:center}
.ch{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px 6px;margin-bottom:4px;font-size:13px}
.ch span{flex:1;overflow:hidden;text-overflow:ellipsis}.ch button{padding:2px 6px;font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.row input{width:60px}

button{border-radius:9px;background:rgba(255,255,255,.1);font:600 13px system-ui;transition:background .15s,transform .15s}button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
#mb{background:rgba(10,16,26,.8);padding:8px 14px}#top{border-radius:16px;background:linear-gradient(90deg,rgba(194,54,46,.55),rgba(10,16,26,.85) 35%,rgba(10,16,26,.85) 65%,rgba(47,97,199,.55))}
#menu{background:rgba(5,8,14,.55);backdrop-filter:blur(6px)}
#mp{background:linear-gradient(160deg,#1b2740,#0f1624);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(780px,96vw);max-height:none;overflow:hidden}
#mh{display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:18px;border-bottom:1px solid rgba(255,255,255,.08)}#mh b{flex:1}
#tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}.tab{background:transparent;border-radius:10px 10px 0 0;padding:9px 14px}.tab.on{background:rgba(255,255,255,.12);box-shadow:inset 0 -3px #ffd84d}
#pg{padding:14px 18px 18px;max-height:62vh;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.col{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;min-height:110px}
.ch0,.ch1,.ch2{font-weight:800;text-align:center;padding:7px;border-radius:8px;margin-bottom:8px;font-size:13px;letter-spacing:.5px}.ch1{background:#c2362e}.ch2{background:#2f61c7}.ch0{background:#4a5568}
.pl{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px}.pl:hover{background:rgba(255,255,255,.08)}
.av{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#4a5568;flex:none}.t1 .av{background:#c2362e}.t2 .av{background:#2f61c7}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.acts{display:flex;gap:3px;opacity:.4}.pl:hover .acts{opacity:1}.ic{padding:3px 6px;font-size:12px}.emp{opacity:.4;text-align:center;font-size:12px;padding:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px}.bar input{width:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cam{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 6px;border-radius:12px;background:rgba(255,255,255,.07);position:relative}.cam b{font-size:28px}.cam small{position:absolute;top:6px;right:9px;opacity:.5}.cam.on{background:#2e8b57;box-shadow:0 0 0 2px #7dffb0}
.keys{display:grid;gap:7px;margin-bottom:12px}.kr{display:flex;align-items:center;gap:8px}.kr span{flex:1}.key{min-width:74px;background:#f2f2f2;color:#111;box-shadow:0 3px 0 #8a929c}.key.on{background:#ffd84d}
.pri{background:#2e8b57}.hint{opacity:.65;font-size:12px;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(10,16,26,.88);padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .4s;pointer-events:none}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.3)}.sw.on{border-color:#fff;box-shadow:0 0 0 2px #7dffb0}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
</style></head><body>
<div id="lobby"><div class="pan"><h1>⚽ HaxBall 3D</h1>
<input id="nm" maxlength="14" placeholder="Tu nombre">
<button id="bc" style="background:#2e8b57">Crear sala</button>
<div style="display:flex;gap:6px"><input id="cd" placeholder="Código de sala" style="flex:1"><button id="bj">Unirse</button></div>
<div id="err"></div></div></div>
<div id="code" class="pan" hidden><span id="cs"></span><span id="dbg" style="opacity:.75;font-size:12px"></span><button id="cp">Copiar link</button></div>
<div id="top" class="pan" hidden></div><button id="mb" hidden>☰ Menú · Esc</button>
<div id="msg"></div><div id="pw" class="pan" hidden style="position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-size:17px;font-weight:700;cursor:pointer"></div>
<div id="chat" hidden><div id="log"></div><input id="ci" maxlength="200" placeholder="Enter para chatear · /help para comandos"></div>
<div id="toast"></div>
<div id="menu"><div id="mp"><div id="mh"><b>⚽ Menú de sala</b><button id="mx">✕</button></div><div id="tabs"></div><div id="pg"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const HW=370,HH=170,GH=64,GD=36,PR=15,BR=7,$=id=>document.getElementById(id);
const el=(t,x,c,f)=>{const e=document.createElement(t);if(x)e.textContent=x;if(c)e.className=c;if(f)e.onclick=f;return e};
const S={b:{x:0,y:0,vx:0,vy:0},p:{},s:[0,0],m:0,fr:0,over:0,run:0,pa:0,tm:180,ot:0,lim:[3,3]};
let peer,conn,isHost=false,myId='',PL={},ROSc={},camV=0,tk=0;
const ros=()=>isHost?PL:ROSc,TN=['Espectadores','Rojo','Azul'],mi={x:0,y:0,k:0,p:0};
$('nm').value=localStorage.getItem('hx3n')||'';const hs=location.hash.slice(1);if(hs)$('cd').value=hs;
const myName=()=>($('nm').value.trim()||'Jugador'+(10+Math.random()*89|0)).slice(0,14);
const err=m=>{$('err').textContent=m};
// ---------- red ----------
function enter(code){$('lobby').style.display='none';for(const i of['code','top','mb','chat'])$(i).hidden=false;
 $('cs').textContent='Sala: '+code;const l=location.href.split('#')[0]+'#'+code;$('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(l).then(()=>say({t:'msg',m:'Link copiado',c:'#ffd84d'},myId))}
$('bc').onclick=()=>{localStorage.setItem('hx3n',$('nm').value);startHost()};
$('bj').onclick=()=>{const c=$('cd').value.trim().toLowerCase();if(!c)return err('Poné el código');localStorage.setItem('hx3n',$('nm').value);join(c)};
function startHost(){const code=Math.random().toString(36).slice(2,7);peer=new Peer('hx3d-'+code);
 peer.on('open',()=>{isHost=true;myId='host';PL.host={id:'host',n:myName(),team:0,admin:1,pw:-1,sk:MYSK,in:{x:0,y:0,k:0}};begin();setT('host',1,1);enter(code);try{history.replaceState(0,'','#'+code)}catch(e){}
  sys('Sala creada. Pasales el link o el código a tus amigos. Escribí /help');bro()});
 peer.on('connection',c=>{c.on('data',d=>hdata(c,d));c.on('close',()=>drop(c.peer))});
 peer.on('error',e=>{if(e.type==='unavailable-id')startHost();else err('Error: '+e.type)})}
function join(code){err('Conectando...');peer=new Peer();peer.on('open',id=>{myId=id;conn=peer.connect('hx3d-'+code,{reliable:true});
 conn.on('open',()=>{conn.send({t:'hi',n:myName(),sk:MYSK});enter(code)});conn.on('data',cdata);
 conn.on('close',()=>{say({t:'msg',m:'Se cerró la sala. Recargá la página.',c:'#ff7a7a'},myId)})});
 peer.on('error',e=>err(e.type==='peer-unavailable'?'Sala no encontrada':'Error: '+e.type))}
function uniq(n,id){let b=n,i=2;while(Object.values(PL).some(p=>p.id!==id&&p.n.toLowerCase()===n.toLowerCase()))n=b+i++;return n}
function hdata(c,d){const id=c.peer;
 if(d.t==='hi'){PL[id]={id,n:uniq(String(d.n).slice(0,14),id),team:0,admin:0,sk:sksan(d.sk),pw:S.pw?Math.floor(Math.random()*7):-1,conn:c,in:{x:0,y:0,k:0}};let r=0,b=0;for(const i in PL){PL[i].team==1&&r++;PL[i].team==2&&b++}setT(id,r<=b?1:2,1);c.send({t:'wel'});bro();pwMsg(id);sys(PL[id].n+' entró')}
 else if(!PL[id])return;else if(d.t==='in')PL[id].in={x:+d.x||0,y:+d.y||0,k:+d.k||0,p:+d.p||0};
 else if(d.t==='act')act(id,d.a,d.x,d.y);else if(d.t==='chat')chat(id,String(d.m));else if(d.t==='pg')c.send({t:'pn',n:d.n})}
function cdata(d){if(d.t==='s'){S.b={x:d.b[0],y:d.b[1],vx:d.b[2],vy:d.b[3]};const np={};for(const i in d.p){const q=d.p[i];np[i]={x:q[0],y:q[1],vx:q[2],vy:q[3],r:q[4],cd:q[5]}}
  S.p=np;S.s=d.s;S.m=d.m;S.tm=d.tm;S.run=d.run;S.pa=d.pa;S.ot=d.ot;S.lim=d.lim}
 else if(d.t==='ros'){ROSc={};for(const i in d.r)ROSc[i]={id:i,n:d.r[i][0],team:d.r[i][1],admin:d.r[i][2],pw:d.r[i][3],sk:d.r[i][4]};menu()}else if(d.t==='msg')show(d);else if(d.t==='pn')PING=Date.now()-d.n}
const all=o=>{for(const i in PL)if(PL[i].conn)PL[i].conn.send(o)};
function say(o,to){if(!isHost)return show(o);if(!to){all(o);show(o)}else if(to==='host')show(o);else PL[to]&&PL[to].conn.send(o)}
const sys=m=>say({t:'msg',m,c:'#ffd84d'});
function bro(){const r={};for(const i in PL)r[i]=[PL[i].n,PL[i].team,PL[i].admin,PL[i].pw,PL[i].sk];all({t:'ros',r});menu()}
function drop(id){if(!PL[id])return;const n=PL[id].n;delete PL[id];delete S.p[id];bro();sys(n+' salió')}
function show(o){const l=$('log');for(const m of String(o.m).split('\n')){const d=el('div',m);d.style.color=o.c||'#fff';l.appendChild(d);setTimeout(()=>d.className='old',10000)}while(l.children.length>14)l.removeChild(l.firstChild)}
// ---------- chat y comandos ----------
const HELP='Comandos: /nick nombre · /red · /blue · /spec · /afk · /list\nAdmin: /move nombre rojo|azul|spec · /kick nombre · /admin nombre\n/start · /stop · /pause · /reset · /shuffle · /swap · /clear · /score n · /time minutos (0 = sin límite)\nTodos: /avatar xx (tu skin: menú → Skin) · /extrapolation 0-200 (solo vos) · /ping\nPoderes: /poderes (activa y sortea uno al azar para cada uno; de nuevo = volver a sortear) · /poderes off · /poder (ver el tuyo)';
function chat(id,m){m=m.trim();if(!m)return;if(m[0]==='/')return cmd(id,m);const p=PL[id];say({t:'msg',m:p.n+': '+m,c:p.team==1?'#ff9a90':p.team==2?'#9abcff':'#ddd'})}
function find(q){q=(q||'').toLowerCase();const L=Object.values(PL);return L.find(p=>p.n.toLowerCase()===q)||L.find(p=>p.n.toLowerCase().startsWith(q))}
function cmd(id,m){const a=m.slice(1).split(/\s+/),c=a.shift().toLowerCase(),W=t=>say({t:'msg',m:t,c:'#ffd84d'},id),T={red:1,rojo:1,blue:2,azul:2,spec:0,afk:0};
 const tg=()=>{const p=find(a[0]);if(!p)W('Jugador no encontrado');return p};
 if(c==='help')W(HELP);else if(c==='list')W('Jugadores: '+Object.values(PL).map(p=>(p.admin?'★':'')+p.n+' ('+TN[p.team]+')').join(', '));
 else if(c==='nick')act(id,'nick',a.join(' '));else if(c in T&&c!=='move')act(id,'move',id,T[c]);
 else if(c==='move'){const p=tg(),t=T[(a[1]||'').toLowerCase()];if(p&&t!==undefined)act(id,'move',p.id,t);else if(p)W('Uso: /move nombre rojo|azul|spec')}
 else if(c==='kick'||c==='admin'){const p=tg();if(p)act(id,c,p.id)}
 else if(c==='score'||c==='time')act(id,'lim',c==='score'?+a[0]:null,c==='time'?+a[0]:null);
 else if(c==='avatar')act(id,'skin',null,a.join(''));
 else if(c==='poderes'||c==='powers')act(id,'pw',(a[0]||'').toLowerCase());
 else if(c==='poder'){const k=PL[id].pw;W(k>=0?'Tu poder: '+PWR[k][0]+' '+PWR[k][1]+' · tecla de Poder (E por defecto)':'No tenés poder. Un admin puede activarlos con /poderes')}
 else if(['start','stop','pause','reset','shuffle','swap','clear'].includes(c))act(id,c);else W('Comando desconocido. /help')}
function setT(id,t,q){const p=PL[id];if(!p)return;p.team=t;if(t){const o=S.p[id]||(S.p[id]={x:0,y:0,vx:0,vy:0,kc:0});o.t=t;o.in=p.in;place(o)}else delete S.p[id];if(!q){bro();sys(p.n+' → '+TN[t])}}
function act(f,a,x,y){const p=PL[f];if(!p)return;const W=t=>say({t:'msg',m:t,c:'#ffd84d'},f);
 if(a==='nick'){x=String(x||'').trim().slice(0,14);if(!x)return W('Uso: /nick nombre');p.n=uniq(x,f);return bro()}
 if(a==='skin'){const c=p.sk||[0,0,''];p.sk=sksan([x?x[0]:c[0],x?x[1]:c[1],y==null?c[2]:y]);return bro()}
 if(a==='move'){if(!PL[x])return;if(x!==f&&!p.admin)return W('Solo los admins pueden mover a otros');return setT(x,y)}
 if(!p.admin)return W('Solo los admins pueden hacer eso');
 if(a==='kick'){if(x==='host')return W('No se puede echar al anfitrión');const c=PL[x]&&PL[x].conn;if(c){sys(PL[x].n+' fue expulsado');c.close();drop(x)}}
 else if(a==='admin'&&PL[x]){PL[x].admin^=1;bro();sys(PL[x].n+(PL[x].admin?' ahora es admin':' ya no es admin'))}
 else if(a==='start'||a==='reset'){begin();sys('¡Arranca la partida!')}
 else if(a==='pw'){if(x==='off'){S.pw=0;for(const i in PL)PL[i].pw=-1;bro();sys('Poderes desactivados')}else{S.pw=1;givePw();bro();sys('¡Poderes activados! Cada uno recibió uno distinto al azar.')}}
 else if(a==='stop'){S.run=0;sys('Partida detenida')}else if(a==='pause'){S.pa^=1;sys(S.pa?'Pausa':'Se reanuda')}
 else if(a==='shuffle'){const ids=Object.keys(PL).sort(()=>Math.random()-.5);ids.forEach((i,k)=>setT(i,k%2+1,1));bro();sys('Equipos mezclados')}
 else if(a==='swap'){for(const i in PL)if(PL[i].team)setT(i,3-PL[i].team,1);bro();sys('Equipos intercambiados')}
 else if(a==='clear'){for(const i in PL)setT(i,0,1);bro();sys('Todos a espectadores')}
 else if(a==='lim'){if(x>=0&&x<=30)S.lim[0]=x|0;if(y>=0&&y<=30)S.lim[1]=y|0;sys('Límites: '+S.lim[0]+' goles, '+S.lim[1]+' min (valen desde el próximo inicio)')}}
const A=(a,x,y)=>isHost?act('host',a,x,y):conn&&conn.send({t:'act',a,x,y});
const ci=$('ci');
addEventListener('keydown',e=>{if(rb){e.preventDefault();e.stopPropagation();const k=e.key.toLowerCase();if(k!=='escape'){KB[rb[0]][rb[1]]=k==='backspace'?'':k;svk()}rb=null;menu();if(document.activeElement)document.activeElement.blur();return}
 if(e.target===ci){e.stopPropagation();if(e.key==='Enter'){const v=ci.value;ci.value='';if(v.trim()&&!localCmd(v))isHost?chat('host',v):conn.send({t:'chat',m:v});ci.blur()}else if(e.key==='Escape')ci.blur();return}
 if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){ci.focus();e.preventDefault()}else if(e.key==='Escape')$('menu').classList.toggle('on')},true);
ci.onfocus=()=>$('chat').classList.add('f');ci.onblur=()=>$('chat').classList.remove('f');
// ---------- menú ----------
$('mb').onclick=()=>$('menu').classList.toggle('on');$('mx').onclick=()=>$('menu').classList.remove('on');
const CAMS=[['🎬','Normal'],['🏟','Lateral'],['🛰','Cenital'],['🏃','3ª persona'],['👁','1ª persona'],['🔴','Arco rojo'],['🔵','Arco azul']];let tab=0;
const toast=m=>{const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1800)};
function setCam(i){camV=i;toast('Cámara: '+CAMS[i][1]+' ('+(i+1)+')');if(window.menu&&$('menu').classList.contains('on'))menu()}
const ib=(t,tt,f)=>{const b=el('button',t,'ic',f);b.title=tt;return b};
function menu(){const R=ros(),me=R[myId],ad=me&&me.admin,t=$('tabs'),pg=$('pg');t.textContent='';pg.textContent='';if(tab===4&&!ad)tab=0;
 ['👥 Equipos','🎥 Cámara','⌨️ Controles','🎨 Skin','⚙️ Partida'].forEach((n,i)=>{if(i===4&&!ad)return;t.append(el('button',n,i===tab?'tab on':'tab',()=>{tab=i;menu()}))});
 if(tab===0){const w=el('div',0,'cols');
  for(const tm of[1,0,2]){const c=el('div',0,'col t'+tm),L=Object.values(R).filter(p=>p.team===tm);c.append(el('div',TN[tm]+' · '+L.length,'ch'+tm));
   for(const p of L){const h=el('div',0,'pl'),a=el('div',0,'acts');h.append(el('i',(p.n[0]||'?').toUpperCase(),'av'),el('span',(p.admin?'★ ':'')+p.n+(p.pw>=0?' '+PWR[p.pw][0]:''),'nm'));
    if(ad||p.id===myId)for(const u of[1,0,2])if(u!==tm)a.append(ib(['👁','🔴','🔵'][u],'Pasar a '+TN[u],()=>A('move',p.id,u)));
    if(ad){a.append(ib(p.admin?'☆':'★',p.admin?'Quitar admin':'Dar admin',()=>A('admin',p.id)));if(p.id!=='host')a.append(ib('✕','Expulsar',()=>A('kick',p.id)))}
    h.append(a);c.append(h)}
   if(!L.length)c.append(el('div','vacío','emp'));w.append(c)}
